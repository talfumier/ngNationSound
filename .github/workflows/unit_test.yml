name: DataService unit testing before deployment

on:
  push:
    branches: ["prod1"]
  pull_request:
    branches: ["prod1"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - name: Run tests
        run: npm run test:ci
      - name: Run build
        run: npm run build
